<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="app" aria-label="Todo 앱">
        <header class="header">
            <h1 class="title">Todo</h1>
            <p class="subtitle">오늘 할 일을 깔끔하게 정리해요.</p>
        </header>

        <section class="card" aria-label="Todo 입력">
            <form id="todoForm" class="todo-form" autocomplete="off">
                <label class="sr-only" for="todoInput">할 일 입력</label>
                <input id="todoInput" class="todo-input" type="text" placeholder="할 일을 입력하세요" maxlength="80" />
                <button class="btn btn-primary" type="submit">추가</button>
            </form>

            <!-- 입력 검증/안내 메시지: 스크린 리더가 읽을 수 있도록 live region으로 구성 -->
            <p id="helperText" class="helper" role="status" aria-live="polite"></p>
        </section>

        <section class="card" aria-label="Todo 목록">
            <div class="list-header">
                <h2 class="list-title">목록</h2>
                <p id="counterText" class="counter" aria-label="카운터"></p>
            </div>

            <!-- 일간 뷰(3번 요구사항): 선택 날짜에 해당하는 Todo만 보여준다. -->
            <div class="day-nav" aria-label="날짜 이동">
                <button id="prevDayBtn" class="btn" type="button">이전</button>
                <p id="currentDateText" class="day-text" aria-live="polite"></p>
                <button id="nextDayBtn" class="btn" type="button">다음</button>
            </div>

            <!-- 상태별 필터 탭(2번 요구사항) -->
            <nav class="filters" aria-label="상태 필터">
                <button class="filter-tab is-active" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="filter-tab" type="button" data-filter="active" aria-pressed="false">진행 중</button>
                <button class="filter-tab" type="button" data-filter="completed" aria-pressed="false">완료</button>
            </nav>

            <ul id="todoList" class="todo-list" aria-label="Todo 리스트"></ul>
            <p id="emptyState" class="empty-state" hidden>아직 할 일이 없어요. 새로운 Todo를 추가해 보세요.</p>
        </section>

        <footer class="footer">
            <small>kakaoTechCampus Assignment • Vanilla JS Todo</small>
        </footer>
    </main>

    <script src="./app.js"></script>
</body>

</html>
